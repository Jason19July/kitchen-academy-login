<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meat Masterclass Two | The Kitchen Academy</title>
    <!-- Memberstack Security Script -->
    <script data-memberstack-app="app_cmlt23jfd002u0stjhljd13s9" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        /* This makes the Gamma video fill the entire browser window */
        #courseFrame { display: none; border: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <!-- Your Unique Meat Masterclass Two Gamma Embed -->
    <iframe id="courseFrame" src="https://gamma.app/embed/t3whs9lurxe0hmx" allow="fullscreen" title="Meat Masterclass Two"></iframe>

    <script>
        // Check if the person is a logged-in member
        window.$memberstackDom.getCurrentMember().then(({ data: member }) => {
            if (member && member.planConnections) {
                // Get all Plan IDs the member has
                const plans = member.planConnections.map(c => c.planId);

                const isAcademy = plans.includes('pln_the-kitchen-academy-gi310uow');
                const isPrivate = plans.includes('pln_the-private-kitchen-fv310jek');
                const hasMeatTwo = plans.includes('pln_single-course-meat-masterclass-two-s200iwf');

                if (isAcademy || isPrivate || hasMeatTwo) {
                    // Member has access! Show the Meat Course.
                    document.getElementById('courseFrame').style.display = 'block';
                } else {
                    // Logged in but doesn't own this course! Redirect to Sales Page.
                    window.location.href = "https://the-kitchen-academy-59amry9.gamma.site/start-cooking";
                }
            } else {
                // Not logged in! Redirect to the Sales Page.
                window.location.href = "https://the-kitchen-academy-59amry9.gamma.site/start-cooking";
            }
        }).catch(() => {
            // Error check! Redirect to the Sales Page.
            window.location.href = "https://the-kitchen-academy-59amry9.gamma.site/start-cooking";
        });
    </script>
</body>
</html>
